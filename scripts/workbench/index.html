<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Sysmac 迁移工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1d2321; --mute:#6b7470; --line:#dfe2dc;
  --accent:#0f6e63; --accent-2:#e6f2ef; --warn:#b5651d; --warn-bg:#fdf1e4; --bad:#b3261e; --bad-bg:#fbe9e7;
  --ok:#2e7d32; --ok-bg:#e8f5e9; --blue:#1f5fa8; --blue-bg:#e8f0fb; --yel-bg:#fff7d6;
  --mono:"Cascadia Mono","Consolas","Microsoft YaHei Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);display:flex;height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
/* 侧栏 */
#side{width:300px;flex:none;background:#18201e;color:#e8ece9;display:flex;flex-direction:column;overflow:auto}
#side h1{font-size:16px;margin:0;padding:18px 18px 4px;letter-spacing:.5px}
#side .sub{padding:0 18px 14px;color:#9aa6a1;font-size:12px;border-bottom:1px solid #2a3431}
#side .sect{padding:14px 18px 6px;color:#9aa6a1;font-size:12px}
#projects{padding:0 10px}
.proj{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;color:#d6dcd9}
.proj:hover{background:#232d2a}.proj.on{background:#0f6e63;color:#fff}
.newp{display:flex;gap:6px;padding:8px 18px}
.newp input{flex:1;background:#232d2a;border-color:#33403c;color:#fff}
.newp button{background:#232d2a;border-color:#33403c;color:#fff}
.step{margin:8px 12px;padding:12px;border:1px solid #2a3431;border-radius:8px;background:#1e2826}
.step .t{display:flex;align-items:center;gap:8px;font-weight:600}
.step .n{width:22px;height:22px;border-radius:50%;background:#33403c;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.step.done .n{background:var(--accent)}
.step p{margin:6px 0 8px;color:#9aa6a1;font-size:12px}
.step button{width:100%;margin-top:4px;background:#2a3431;border-color:#3b4844;color:#e8ece9}
.step button.primary{background:var(--accent);border-color:var(--accent)}
.step .info{font-size:12px;color:#c9d2ce;word-break:break-all}
/* 主区 */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#top .title{font-size:18px;font-weight:600}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fafbf9;min-width:84px}
.card b{display:block;font-size:18px}.card span{font-size:12px;color:var(--mute)}
.card.warn b{color:var(--warn)}.card.bad b{color:var(--bad)}.card.ok b{color:var(--ok)}
#tabs{display:flex;gap:2px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute);white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.tab .badge{font-size:11px;background:var(--line);border-radius:9px;padding:0 6px;margin-left:4px;color:var(--ink)}
#view{flex:1;overflow:auto;padding:16px 22px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar .hint{color:var(--mute);font-size:12px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#f7f8f6;z-index:1;font-weight:600;white-space:nowrap}
tr:hover td{background:#fafcfb}
td.st{white-space:nowrap}
td.code{font-family:var(--mono);font-size:12px;white-space:nowrap}
td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.txt{min-width:160px;max-width:420px;word-break:break-all}
td.short{white-space:nowrap}
th.num{text-align:right}
td input{width:100%;min-width:110px;padding:3px 6px}
td input.saved{border-color:var(--ok);background:var(--ok-bg)}
.pill{display:inline-block;padding:0 6px;border-radius:4px;font-size:12px}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-blue{background:var(--blue-bg);color:var(--blue)}.p-new{background:#e6f4ea;color:#1b6b33}
.empty{color:var(--mute);padding:40px;text-align:center}
tr.review-yellow td{background:var(--warn-bg)}
/* 程序段 */
.secwrap{display:flex;gap:14px;height:100%}
.seclist{width:240px;flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto}
.seclist div{padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
.seclist div.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.codewrap{flex:1;display:flex;gap:10px;min-width:0}
.pane{flex:1;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;min-width:0}
.pane h4{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);background:#f7f8f6;position:sticky;top:0}
pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.6}
pre .l{display:block;padding:0 12px;white-space:pre}
pre .l.chg{background:var(--blue-bg)} pre .l.cmt{background:#f1f1f1;color:#888} pre .l.add{background:#e6f4ea}
pre .l.en{background:var(--yel-bg)} pre .l.blk{background:#22302c;color:#cfe;font-weight:600}
.legend{display:flex;gap:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-2px}
#log{position:fixed;right:18px;bottom:18px;width:520px;max-height:46vh;background:#101614;color:#cfe;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;flex-direction:column}
#log header{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #26302d}
#log pre{padding:8px 12px;overflow:auto;white-space:pre-wrap}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#18201e;color:#fff;padding:8px 16px;border-radius:8px;display:none;z-index:9}
.md{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 22px;max-width:980px}
.md h1,.md h2{border-bottom:1px solid var(--line);padding-bottom:4px}
.md code{background:#f2f3f0;padding:0 4px;border-radius:3px;font-family:var(--mono)}
.paste{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px;max-width:880px}
.paste ol li{margin:10px 0}
.q-toolbar{position:sticky;top:0;z-index:4;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.q-toolbar .guide{margin:0 0 9px;color:var(--mute)}
.q-list{display:grid;gap:12px;margin-top:14px;max-width:1280px}
.q-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:14px 16px}
.q-card.queued{border-left-color:var(--accent)}
.q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.q-head b{font-family:var(--mono)}.q-tag{font-size:12px;padding:2px 8px;border-radius:12px;background:var(--warn-bg);color:var(--warn)}
.q-tag.saved{background:var(--accent-2);color:var(--accent)}
.q-reason{color:var(--bad);margin:8px 0}.q-loc,.q-help{color:var(--mute);font-size:12px}
.q-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.q-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.q-form select,.q-form input{font-size:13px;color:var(--ink);max-width:740px}
.q-form .wide{flex:1;min-width:240px}.q-form .wide input{width:100%}
.q-context{max-height:190px;overflow:auto;white-space:pre-wrap;background:#f5f7f4;padding:8px;border-radius:5px;margin-top:6px}
.q-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.q-actions span{font-size:12px;color:var(--mute)}
#mobile-steps{display:none}
.q-compact{width:100%;font-size:12px;table-layout:fixed}.q-compact td{padding:5px 7px;vertical-align:middle}
.q-compact .q-check{width:32px}.q-compact .q-point{width:26%}.q-compact .q-old{width:25%}.q-compact .q-issue{width:25%}.q-compact .q-op{width:130px}
.q-compact .q-code{font:12px var(--mono);overflow-wrap:anywhere}.q-compact .q-sub{font-size:11px;color:var(--mute);margin-top:3px}
.q-compact input[type=checkbox]{width:16px;min-width:0}.q-compact .q-op button{font-size:12px;padding:4px 7px}
.q-compact tr.selected td{background:var(--blue-bg)}.q-compact tr.queued td{background:var(--accent-2)}
.q-compact .mobile-issue{display:none}.q-scope{padding:7px 10px;background:var(--accent-2);border-radius:6px;font-size:12px;margin:7px 0}
.q-group-guide{margin:8px 0;font-size:12px;color:var(--ink)}.q-group-guide b{color:var(--accent)}
.q-group-nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.q-group-nav button{font-size:12px;padding:4px 8px}.q-group-nav .on{background:var(--accent-2);border-color:var(--accent)}
.q-group-heading{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}.q-group-heading b{color:var(--accent)}.q-group-heading button{font-size:12px;padding:4px 8px}
.q-compact tr.q-group-row td{background:var(--accent-2);padding:8px;border-top:2px solid var(--line)}.q-group-section{margin:16px 0 8px;padding:10px;background:var(--accent-2);border-radius:6px}
.q-compact-wrap{overflow:auto;max-width:100%}.q-table-toolbar{padding:9px;font-size:12px}.q-table-toolbar .guide{font-size:12px}
dialog.q-dialog{width:min(760px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--ink)}
dialog.q-dialog::backdrop{background:rgba(14,26,22,.38)}.q-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.q-dialog .q-card{border-left:0;padding:8px 0}.q-dialog h3{margin:0}.q-preview-table input{width:100%;min-width:140px}
#qpreview[open]{display:flex;flex-direction:column;overflow:hidden;height:88vh}#qpreview .q-dialog-head,#qpreview .q-guide-box,#qpreview .q-actions{flex-shrink:0}
#qpreview .q-preview-scroll{overflow:auto;min-height:0;flex:1}#qpreview .q-actions{padding-top:10px;border-top:1px solid var(--line);background:white}
.q-preview-table{font-size:12px}.q-preview-table th{position:sticky;top:0;z-index:1}.q-preview-error.q-preview-ok{color:var(--accent)}
.q-preview-table select{max-width:200px}.q-preview-error{color:var(--bad);font-size:12px}.q-guide-box{background:var(--accent-2);padding:10px;border-radius:6px;font-size:13px}
.q-preview-table tr.problem td{background:var(--bad-bg)}.q-batch-config{border:1px solid var(--line);border-radius:6px;padding:8px}
@media(max-width:1000px){
  #side{width:240px}#top{padding:10px}#tabs{padding:0 10px}#view{padding:12px}
  .cards{gap:6px}.card{min-width:68px;padding:5px 8px}
}
@media(max-width:720px){
  body{display:block;height:auto;min-height:100vh;overflow:auto}
  #side{width:100%;height:auto;overflow:visible;display:block}
  #side h1{padding:10px 14px 2px}#side .sub{padding:0 14px 8px}#side .sect{padding:8px 14px 2px}
  #projects{display:flex;flex-wrap:wrap}.proj{padding:6px 10px}.newp{padding:6px 14px}.newp input{min-width:0}
  #mobile-steps{display:block;margin:4px 14px 10px;background:#2a3431;color:#fff;border-color:#3b4844}
  #steps{display:none}body.steps-open #steps{display:block}
  #main{min-height:60vh}#top{display:block}.title{overflow-wrap:anywhere;margin-bottom:8px}
  .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.card{min-width:0;padding:4px 6px}.card b{font-size:16px}.card span{font-size:11px}
  #tabs{position:sticky;top:0;z-index:6}.tab{padding:8px 10px;font-size:13px}
  #view{overflow:visible;padding:10px}#view>table{display:block;max-width:100%;overflow:auto}
  .q-toolbar{position:static}.q-toolbar input,.q-toolbar select{max-width:100%;min-width:0}
  #qsearch{width:100%}.q-card{padding:12px}.q-head b{font-size:12px;overflow-wrap:anywhere}.q-head{gap:6px}
  .q-form{display:block}.q-form label{margin:8px 0}.q-form .wide{min-width:0}.q-form select,.q-form input{width:100%;max-width:100%;min-width:0}
  .q-actions button{flex:1 1 43%}.q-actions span{width:100%}.q-context{overflow-wrap:anywhere}
  .q-compact .q-old,.q-compact .q-issue{display:none}.q-compact .q-point{width:auto}.q-compact .q-op{width:66px}.q-compact .q-op button{display:block;width:100%;margin:3px 0}
  .q-compact .mobile-issue{display:block}.q-table-toolbar{padding:8px}.q-compact th,.q-compact td{padding:4px}
  dialog.q-dialog{max-width:96vw;padding:10px}.q-preview-table{min-width:650px}
  .secwrap{flex-direction:column;height:auto!important}.seclist{width:100%;max-height:180px}.codewrap{flex-direction:column}.pane{min-height:150px}.legend{flex-wrap:wrap}
  #log{width:calc(100% - 20px);right:10px;bottom:10px;z-index:8}
}
@media(max-width:420px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<aside id="side">
  <h1>Sysmac 迁移工作台</h1>
  <div class="sub">旧程序 + 新图纸 → 新程序段</div>
  <div class="sect">项目</div>
  <div id="projects"></div>
  <div class="newp"><input id="newname" placeholder="新项目名"><button onclick="newProject()">新建</button></div>
  <button id="mobile-steps" aria-expanded="false" onclick="const open=document.body.classList.toggle('steps-open');this.textContent=open?'收起项目步骤':'展开项目步骤';this.setAttribute('aria-expanded',String(open))">展开项目步骤</button>
  <div id="steps"></div>
</aside>
<main id="main">
  <div id="top"><div class="title" id="ptitle">请选择或新建项目</div><div class="cards" id="cards"></div></div>
  <div id="tabs"></div>
  <div id="view"><div class="empty">左侧选择项目，按 ①→④ 操作</div></div>
</main>
<div id="log"><header><span id="logtitle">任务</span><span><button onclick="hideLog()">关闭</button></span></header><pre id="logtext"></pre></div>
<div id="toast"></div>
<script>
let P=null, ST=null, TAB='overview', cache={}, polling=null, secCur=null, showOld=true;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt={}){
  const r=await fetch(path,opt); const j=await r.json().catch(()=>({error:'返回不是 JSON'}));
  if(!r.ok){const error=new Error(j.error||j.log||('HTTP '+r.status));error.status=r.status;throw error} return j;
}
const post=(path,obj)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj||{})});
function toast(t,ms=2500){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}

async function loadProjects(){
  let ps; try{ps=await api('/api/projects')}catch(e){toast('加载项目失败，2 秒后重试：'+e.message);setTimeout(loadProjects,2000);return}
  $('#projects').innerHTML=ps.map(p=>`<div class="proj ${P===p.name?'on':''}" onclick="selectProject('${esc(p.name)}')"><span>${esc(p.name)}</span><span>${p.has_output?'✓':''}</span></div>`).join('')||'<div class="sub">还没有项目</div>';
  if(!P&&ps.length) selectProject(ps[0].name);
}
async function newProject(){
  const n=$('#newname').value.trim(); if(!n) return toast('先输入项目名');
  await post('/api/projects',{name:n}); $('#newname').value=''; P=n; await loadProjects(); selectProject(n);
}
async function selectProject(n){P=n;cache={};secCur=null;await refresh();loadProjects()}
async function refresh(){
  if(!P) return; ST=await api(`/api/p/${enc(P)}/status`);
  $('#ptitle').textContent=P; renderSteps(); renderCards(); renderTabs(); renderView();
  if(ST.job&&ST.job.running) watchJob();
}
const enc=encodeURIComponent;
function renderSteps(){
  const j=ST.job||{}, c=ST.counts||{};
  const s1=ST.old_sections>0, s2=!!ST.pdf, s3=ST.has_output;
  $('#steps').innerHTML=`
  <div class="sect">步骤</div>
  <div class="step ${s1?'done':''}"><div class="t"><span class="n">1</span>读取旧程序</div>
    <p>在 Sysmac 左侧 POUs 里多选所有 Input/Output 刷新程序段 → 右键「选择并复制多个项目」，然后点：</p>
    <div class="info">${s1?`已读取 ${ST.old_sections} 个程序段`:''}</div>
    <button class="${s1?'':'primary'}" onclick="readClip()">从剪贴板读取</button></div>
  <div class="step ${s2?'done':''}"><div class="t"><span class="n">2</span>新图纸 PDF</div>
    <p>CAD 导出的 PDF（文字可选中）。</p>
    <div class="info">${s2?esc(ST.pdf.split(/[\\/]/).pop()):''}</div>
    <input type="file" id="pdffile" accept=".pdf" style="display:none" onchange="uploadPdf(this)">
    <button class="${s2?'':'primary'}" onclick="$('#pdffile').click()">${s2?'更换图纸':'选择图纸'}</button></div>
  <div class="step ${s3?'done':''}"><div class="t"><span class="n">3</span>对点并生成</div>
    <p>提取点表 → 对点 → 生成新程序段 → 清算。改了判断后点「重新生成」即可（不重读图纸）。</p>
    <div class="info">${j.running?('进行中：'+esc(j.step)):(j.rc===0?'上次完成':(j.rc?'上次失败，看日志':''))}</div>
    <button class="primary" ${(!s1||!s2||j.running)?'disabled':''} onclick="runAll(true)">对点并生成（含读图）</button>
    <button ${(!s3||j.running)?'disabled':''} onclick="runAll(false)">重新生成（用已有点表）</button></div>
  <div class="step"><div class="t"><span class="n">4</span>粘贴回 Sysmac</div>
    <p>顺序：I/O 映射 → 新增变量 → 程序段。复制别的东西会覆盖剪贴板。</p>
    <button ${s3?'':'disabled'} onclick="setTab('paste')">打开粘贴向导</button></div>
  <div class="step"><div class="t">其他</div>
    <button onclick="post('/api/p/'+enc(P)+'/open_folder')">打开输出文件夹</button>
    <button onclick="setTab('rules')">迁移原则</button>
    <button onclick="window.open('/api','_blank')">AI 接口清单</button></div>`;
}
function renderCards(){
  const c=ST.counts||{}, r=c['对点结果']||{}, a=c['清算分类']||{}, ch=c['改动分类']||{};
  const sum=(o,pre)=>Object.entries(o).filter(([k])=>k.startsWith(pre)).reduce((x,[,v])=>x+v,0);
  if(!ST.has_output){$('#cards').innerHTML='';return}
  const items=[
    ['图纸点',Object.values(r).reduce((x,y)=>x+y,0),''],
    ['改线号',ch['改线号']||0,''],['注释掉',ch['注释掉']||0,''],['新增行',ch['新增']||0,''],['启用',ch['启用']||0,''],
    ['新建变量',c['新增变量']||0,''],
    ['待判断',c['待判断']||0,(c['待判断']?'warn':'ok')],
    ['❌ 对点',sum(r,'❌'),sum(r,'❌')?'bad':'ok'],
    ['清算问题',c['清算']||0,(c['清算']?'warn':'ok')],
    ['已存判断',ST.feedback||0,''],
  ];
  $('#cards').innerHTML=items.map(([k,v,cl])=>`<div class="card ${cl}"><b>${v}</b><span>${k}</span></div>`).join('');
}
const TABS=[['overview','概览'],['results','对点结果'],['doubts','图纸疑点'],['questions','待判断'],['audit','清算报告'],
  ['sections','程序段'],['newvars','新增变量'],['iomap','IO映射'],['changes','变更清单'],['extra','程序有图纸无'],['paste','粘贴向导'],['rules','迁移原则']];
function renderTabs(){
  const c=ST.counts||{};
  const b={questions:c['待判断'],audit:c['清算'],newvars:c['新增变量']};

async function qCatalog(){

  const map=new Map(),appliedNames=new Set();
  function add(s){if(s&&s.simple)map.set(s.section+':'+s.line,s)}
  for(const t of tables){const j=t.columns.indexOf('处理数据');if(j>=0)for(const r of t.rows){try{const m=JSON.parse(r[j]||'{}');add(m.source);if(m.action?.action==='new'&&m.action.values?.var)appliedNames.add(m.action.values.var.toLowerCase())}catch(e){}}}
  for(const t of Q_TASKS)for(const s of t.sources||[])add(s);
  const rows=[...map.values()].sort((a,b)=>a.section.localeCompare(b.section)||a.line-b.line);
  if(P===project)Q_CATALOG={project,generation,rows,appliedNames};return rows;
}
async function qPopulateSources(i){

  }catch(e){toast('读取旧映射失败：'+e.message)}

function qValidate(t,d){

  if(d.action==='new'){
    if(!/^[A-Za-z_\u4e00-\u9fff][\w\u4e00-\u9fff]{0,119}$/.test((d.values.var||'').trim()))throw new Error('请填写合法的新变量名，不能含空格、括号或数组');
    if(['TRUE','FALSE','IF','THEN','ELSE','END_IF','BOOL','INT','REAL','AND','OR','NOT','CASE','FOR'].includes(d.values.var.trim().toUpperCase()))throw new Error('新变量名不能使用 ST 保留字');
    if(!t.sections.includes(d.values.section))throw new Error('请选择要新增到的程序段');

  if(action==='new'&&!Q_BATCH_SETTINGS.section){$('#qnew-section').focus();return toast('先选择新增映射要放入哪个程序段')}
  try{
    const items=batchItems(selected,action,{...Q_BATCH_SETTINGS,valuesFor:t=>({...qDraft(t).values}),remarkFor:t=>qDraft(t).remark});
    await qCatalog();if(P!==project)return;
    Q_BATCH={project,action,items};qRenderBatch();
  }catch(e){toast('无法预览：'+e.message,5000)}
}
function qBatchErrors(){
  const errors=new Map(),batch=Q_BATCH;if(!batch)return errors;
  const names=new Map(),sources=new Map(),selected=new Set(batch.items.map(x=>x.task.id));
  const existing=new Set([...Q_CATALOG.rows.map(s=>s.var.toLowerCase()),...(Q_CATALOG.appliedNames||[])]);
  const active=new Map(Q_TASKS.map(t=>[t.id,t.generation]));
  const stored=Object.entries(qLocal()).filter(([id,s])=>!selected.has(id)&&active.get(id)===s.generation&&s.action==='new'&&!s.reset).map(([,s])=>(s.values.var||'').toLowerCase());
  for(const item of batch.items){const id=item.task.id,d=item.draft;
    try{qValidate(item.task,d)}catch(e){errors.set(id,e.message)}
    if(d.action==='new'){
      const key=(d.values.var||'').trim().toLowerCase();
      if(existing.has(key)||stored.includes(key))errors.set(id,'与旧变量或其他已保存的新变量重名');
      if(names.has(key)){errors.set(id,'本批次变量名重复，请修改');errors.set(names.get(key),'本批次变量名重复，请修改')}else names.set(key,id);
    }
    if(d.action==='source'){
      const key=JSON.stringify(d.values.source);
      if(sources.has(key)){errors.set(id,'多行选中了同一旧映射，需要逐项核对');errors.set(sources.get(key),'多行选中了同一旧映射，需要逐项核对')}else sources.set(key,id);
    }
  }
  return errors;
}
function qRenderBatch(){
  const b=Q_BATCH;if(!b)return;const dialog=$('#qpreview');
  const stations=[...new Set(b.items.map(x=>questionScope(x.task).station).filter(Boolean))];
  dialog.innerHTML=`<div class="q-dialog-head"><h3>批量处理预览 · ${b.items.length} 项</h3><button id="qbatch-cancel" ${Q_BUSY?'disabled':''} onclick="if(!Q_BUSY){$('#qpreview').close();Q_BATCH=null}">取消，不保存</button></div>
    <div class="q-guide-box"><b>${esc(Q_ACTIONS[b.action])}</b><br>${qActionHelp(b.action)}<br>范围：${esc(stations.join('、')||'当前所选项')}；以下全部是已勾选项，与当前显示条数无关。${b.action==='new'?'可逐行修改变量名和程序段；重复名称不会自动改成奇怪后缀。':''}</div>
    <div id="qbatch-errors" class="q-preview-error" style="margin:10px 0"></div>
    <div class="q-preview-scroll"><table class="q-preview-table"><thead><tr><th>线号 / 图纸功能</th><th>${b.action==='new'?'将创建的变量名':'将执行的处理'}</th><th>${b.action==='new'?'放入程序段':'原变量 / 原表达式'}</th></tr></thead><tbody>
    ${b.items.map(({task:t,draft:d},i)=>`<tr id="qbatch-row-${i}"><td><b>${esc(t.wire||'（无线号）')}</b><div class="q-help">${esc(t.function)}</div><div id="qbatch-error-${i}" class="q-preview-error"></div></td>
      <td>${d.action==='new'?`<input aria-label="预览变量名 ${i+1}" value="${esc(d.values.var)}" oninput="Q_BATCH.items[${i}].draft.values.var=this.value;qUpdateBatchErrors()">`:esc(Q_ACTIONS[d.action])}</td>
      <td>${d.action==='new'?`<select aria-label="预览程序段 ${i+1}" onchange="Q_BATCH.items[${i}].draft.values.section=this.value;qUpdateBatchErrors()">${t.sections.map(s=>`<option value="${esc(s)}" ${s===d.values.section?'selected':''}>${esc(s)}</option>`).join('')}</select>`:`<span class="q-code">${esc(d.action==='source'?(t.sources||[]).find(s=>s.section===d.values.source?.section&&s.line===d.values.source?.line)?.raw||'':t.var||t.raw||'不修改表达式')}</span>`}</td></tr>`).join('')}</tbody></table></div>
    <div class="q-actions"><button id="qbatch-save" class="primary" onclick="qExecuteBatch(false)">保存这 ${b.items.length} 项</button><button id="qbatch-apply" onclick="qExecuteBatch(true)">保存并统一生成</button><span id="qbatch-progress">预览不会修改程序；生成时会再次校验映射及变量冲突。</span></div>`;
  qUpdateBatchErrors();dialog.oncancel=e=>{if(Q_BUSY)e.preventDefault();else Q_BATCH=null};if(!dialog.open)dialog.showModal();
}
function qUpdateBatchErrors(){
  if(!Q_BATCH)return;const errors=qBatchErrors();
  Q_BATCH.items.forEach(({task:t},i)=>{const message=errors.get(t.id)||'';$('#qbatch-error-'+i).textContent=message;$('#qbatch-row-'+i).classList.toggle('problem',!!message)});
  $('#qbatch-errors').textContent=errors.size?`${errors.size} 项需修改，修正后才能保存。`:`${Q_BATCH.items.length} 项预览校验通过，等待你保存。`;
  $('#qbatch-errors').classList.toggle('q-preview-ok',!errors.size);
  $('#qbatch-save').disabled=Q_BUSY||errors.size>0;$('#qbatch-apply').disabled=Q_BUSY||errors.size>0;
  $('#qbatch-cancel').disabled=Q_BUSY;
  $('#qpreview').querySelectorAll('input,select').forEach(el=>el.disabled=Q_BUSY);
}
function qFeedbackPayload(t,d){
  qValidate(t,d);const values={};if(d.values.address)values.address=d.values.address.trim();
  if(d.action==='source')values.source=d.values.source;
  if(d.action==='new'){values.var=d.values.var.trim();values.section=d.values.section}
  return {wire:'@review:'+t.id,function:'',var:'',judge:JSON.stringify({action:d.action,values}),remark:d.remark};
}
async function qExecuteBatch(regenerate){
  if(!Q_BATCH||Q_BUSY)return;const b=Q_BATCH,errors=qBatchErrors();if(errors.size)return qUpdateBatchErrors();
  const items=b.items.map(({task,draft})=>qFeedbackPayload(task,draft));Q_BUSY=true;qUpdateBatchErrors();let done=0;
  const progress=n=>{done=n;const el=$('#qbatch-progress');if(el)el.textContent=`正在保存 ${n}/${items.length} 项…`};
  try{
    let batchSupported=false;try{const doc=await api('/api');batchSupported=Object.keys(doc).some(k=>k.includes('/feedback_batch'))}catch(e){}
    if(batchSupported){
      const result=await post(`/api/p/${enc(b.project)}/feedback_batch`,{items});
      if(P===b.project){for(const {task,draft} of b.items){qWriteLocal(task.id,{action:draft.action,values:draft.values,remark:draft.remark,generation:task.generation});Q_DRAFT.set(P+':'+task.id+':'+task.generation,{...draft,query:''});Q_PICKED.delete(task.id)}ST.feedback=result.count}
      progress(items.length);
    }else{
      for(const {task,draft} of b.items){await qPersist(task,draft,b.project);progress(done+1)}
    }
    if(P!==b.project)return;Q_BATCH=null;Q_OPEN=null;Q_BUSY=false;$('#qpreview').close();renderCards();renderQuestions(cache.questions);toast(`已保存 ${done} 项${regenerate?'，正在统一生成':'，可统一应用判断'}`);
    if(regenerate)await runAll(false);
  }catch(e){toast(`已保存 ${done} 项，剩余未保存：${e.message}`,6000)}
  finally{Q_BUSY=false;if(Q_BATCH)qUpdateBatchErrors()}
}
function openQuestionForRow(i){const t=cache[TAB],j=t.columns.indexOf('图纸原线号');Q_FILTER.q=String(t.rows[i][j]||'');Q_FILTER.state='all';setTab('questions')}
async function undoReviewRow(i){
  const project=P,t=cache[TAB],m=JSON.parse(t.rows[i][t.columns.indexOf('处理数据')]||'{}');if(!m.review_id)return;
  try{await post(`/api/p/${enc(project)}/feedback`,{wire:'@review:'+m.review_id});if(P!==project)return;qWriteLocal(m.review_id,null);cache={};toast('已撤回，正在重新生成');await runAll(false)}catch(e){toast('撤回失败：'+e.message)}
}
async function copyMod(mod){
  if(ST.migration){toast('通用格式请按报告中的实际通道逐项映射，暂不提供整模块复制');return}
  const t=cache.iomap, names=t.rows.filter(r=>r[2]===mod).map(r=>r[4]).join('\r\n');
  await navigator.clipboard.writeText(names); toast(`已复制 ${mod} 的变量名，粘到 I/O 映射对应插槽 bit0 起`);
}
async function renderSections(){
  if(!ST.has_output){$('#view').innerHTML='<div class="empty">还没有生成结果</div>';return}
  const secs=cache.secs||(cache.secs=await api(`/api/p/${enc(P)}/sections`));
  secCur=secCur||secs[0];
  const s=await api(`/api/p/${enc(P)}/section/${enc(secCur)}`);
  const cls=l=>/====== ST块/.test(l)?'blk':/\/\/ 新图纸注释/.test(l)?'cmt':/\/\/ 原 /.test(l)?'chg':/\/\/ 新增|新增点（对点工具生成）/.test(l)?'add':/已启用|空块占位/.test(l)?'en':'';
  const render=t=>t.split(/\r?\n/).map(l=>`<span class="l ${cls(l)}">${esc(l)||' '}</span>`).join('');
  $('#view').innerHTML=`<div class="toolbar"><span class="legend"><span><i style="background:var(--blue-bg)"></i>改线号</span><span><i style="background:#f1f1f1"></i>新图纸注释掉</span><span><i style="background:#e6f4ea"></i>新增</span><span><i style="background:var(--yel-bg)"></i>启用/占位</span></span>
    <span style="flex:1"></span><label><input type="checkbox" ${showOld?'checked':''} onchange="showOld=this.checked;renderSections()"> 对照旧程序</label></div>
    <div class="secwrap" style="height:calc(100% - 44px)"><div class="seclist">${secs.map(x=>`<div class="${x===secCur?'on':''}" onclick="secCur='${esc(x)}';renderSections()">${esc(x)}</div>`).join('')}</div>
    <div class="codewrap">${showOld?`<div class="pane"><h4>旧程序</h4><pre>${render(s.old)}</pre></div>`:''}<div class="pane"><h4>新程序 · ${esc(secCur)}</h4><pre>${render(s.new)}</pre></div></div></div>`;
}
function renderPaste(){
  if(ST.migration&&!ST.migration.ready){$('#view').innerHTML='<div class="empty">当前是通用识别核对稿，尚未完成程序迁移，不能粘贴回 Sysmac。请先处理「待判断」与「图纸疑点」。</div>';return}
  $('#view').innerHTML=`<div class="paste"><h3>粘贴回 Sysmac（建议先在工程副本上做）</h3><ol>
  <li><b>I/O 映射</b>：打开「IO映射」页签，按模块点「复制」，粘到 Sysmac I/O 映射对应插槽的 bit0 起。<br><button onclick="setTab('iomap')">打开 IO映射</button></li>
  <li><b>全局变量</b>：点下面按钮复制新增变量，到 Sysmac 全局变量表粘贴。<br><button class="primary" onclick="copyNewvars()">复制新增变量（${(ST.counts||{})['新增变量']||0} 个）</button></li>
  <li><b>程序段</b>：点下面按钮放入剪贴板，然后到 Sysmac 左侧右键 <b>POUs →「粘贴多个项目」</b>（先删掉旧的两个刷新程序）。<b>中间不要再复制别的东西。</b><br><button class="primary" onclick="writeClip()">放入剪贴板</button></li>
  <li><b>编译</b>。有报错截图发给 AI，或看「清算报告」。</li></ol></div>`;
}
async function copyNewvars(){try{await post(`/api/p/${enc(P)}/copy_newvars`);toast('新增变量已复制，到 Sysmac 全局变量表粘贴')}catch(e){toast(e.message)}}
async function writeClip(){try{const j=await post(`/api/p/${enc(P)}/write_clipboard`);showLog('放入剪贴板',j.log);toast('已放入剪贴板 → Sysmac 右键 POUs 粘贴多个项目',4000)}catch(e){showLog('放入剪贴板失败',e.message)}}
async function readClip(){try{const j=await post(`/api/p/${enc(P)}/read_clipboard`);showLog('读取旧程序',j.log);cache={};refresh()}catch(e){showLog('读取失败',e.message)}}
async function uploadPdf(inp){const f=inp.files[0];if(!f)return;toast('上传中…');
  try{await api(`/api/p/${enc(P)}/drawing?filename=${enc(f.name)}`,{method:'POST',body:f});toast('图纸已上传');refresh()}catch(e){toast(e.message)}}
async function runAll(full){try{await post(`/api/p/${enc(P)}/run`,{full});cache={};watchJob();refresh()}catch(e){toast(e.message)}}
function watchJob(){clearInterval(polling);$('#log').style.display='flex';
  polling=setInterval(async()=>{const j=await api(`/api/p/${enc(P)}/job`);$('#logtitle').textContent='任务：'+(j.step||'');const t=$('#logtext');t.textContent=j.log;t.scrollTop=t.scrollHeight;
    if(!j.running){clearInterval(polling);cache={};refresh();toast(j.rc===0?'完成':'失败，看日志',3500)}},1000)}
function showLog(t,s){$('#log').style.display='flex';$('#logtitle').textContent=t;$('#logtext').textContent=s}
function hideLog(){$('#log').style.display='none'}
function md(s){return esc(s).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/^(\d+)\. (.*)$/gm,'<li>$2</li>').replace(/\n\n/g,'<br>')}
loadProjects();
</script>
